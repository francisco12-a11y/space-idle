<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellar Ascent — Idle Space Colony</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=18">
</head>
<body>
<canvas id="starfield"></canvas>
<div id="world-glow"></div>
<div id="nebula"></div>
<div id="tooltip" style="display:none"></div>

<header>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M12 2l2.4 6.2L21 9l-5 4.2L17.5 20 12 16.4 6.5 20 8 13.2 3 9l6.6-.8z" fill="#5ee6d0"/>
    </svg>
    <h1>STELLAR ASCENT</h1>
  </div>
  <div id="res-chips" class="chips"></div>
  <div class="topbar">
    <button id="save-btn" title="Save now">💾 Save</button>
    <button id="reset-btn" class="danger" title="Wipe progress">Reset</button>
  </div>
</header>

<main class="game-grid">
  <nav id="planet-nav"></nav>

  <section id="clicker-view">
    <div class="panel glow-panel planet-header">
      <button id="big-planet" title="Click to mine!">
        <img id="planet-art-img" width="230" height="230" alt="">
      </button>
      <div class="planet-text">
        <h2 id="planet-name"></h2>
        <p id="planet-desc"></p>
        <div id="planet-resource" class="resource-line"></div>
        <div id="mine-info"></div>
      </div>
    </div>
    <div id="locked-note" class="panel" style="display:none"></div>
  </section>

  <section id="store-view">
    <div class="panel" id="news-ticker" title="Click for more news">
      📰 <span id="news-text">...</span>
    </div>

    <div class="panel" id="store-panel">
      <h3>⬆ Upgrades</h3>
      <div id="upgrades" class="upg-tiles"></div>

      <div class="tab-bar">
        <button class="store-tab active" data-tab="colonists">⛏ COLONISTS</button>
        <button class="store-tab" data-tab="research">🧪 RESEARCH</button>
        <button class="store-tab" data-tab="ascend">✦ ASCEND</button>
      </div>

      <div id="tab-colonists" class="tab-content">
        <div class="tab-toolbar">
          <span class="toolbar-label">Buy:</span>
          <span class="buy-mode">
            <button data-buy="1" class="buy active">×1</button>
            <button data-buy="10" class="buy">×10</button>
            <button data-buy="max" class="buy">MAX</button>
          </span>
        </div>
        <div id="buildings"></div>
      </div>

      <div id="tab-research" class="tab-content" style="display:none">
        <div id="techs"></div>
        <div id="next-planet" class="next-planet"></div>
      </div>

      <div id="tab-ascend" class="tab-content" style="display:none">
        <div id="shard-info"></div>
        <button id="ascend-btn">ASCEND</button>
        <div id="masteries"></div>
      </div>
    </div>
  </section>

  <aside id="sidebar">
    <div class="panel" id="ach-view">
      <h3>🏆 Achievements <span id="ach-count"></span></h3>
      <div id="ach-grid"></div>
    </div>

    <div class="panel" id="stats-view">
      <h3>📊 Statistics</h3>
      <div id="stats-list"></div>
    </div>
  </aside>
</main>

<footer><small>AUTOSAVES EVERY 10s · PROGRESS CONTINUES OFFLINE AT 50% RATE</small></footer>

<script src="game.js?v=18"></script>
</body>
</html>
