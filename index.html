<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stellar Ascent — Idle Space Colony</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="starfield"></canvas>
<div id="nebula"></div>

<header>
  <div class="brand">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
      <path d="M12 2l2.4 6.2L21 9l-5 4.2L17.5 20 12 16.4 6.5 20 8 13.2 3 9l6.6-.8z" fill="#5ee6d0"/>
    </svg>
    <h1>STELLAR ASCENT</h1>
  </div>
  <div id="res-chips" class="chips"></div>
  <div class="topbar">
    <button id="save-btn" title="Save now">💾 Save</button>
    <button id="reset-btn" class="danger" title="Wipe progress">Reset</button>
  </div>
</header>

<main>
  <nav id="planet-nav"></nav>

  <section id="planet-view">
    <div class="planet-header panel glow-panel">
      <div class="planet-orbit">
        <img id="planet-art-img" width="120" height="120" alt="">
      </div>
      <div class="planet-text">
        <h2 id="planet-name"></h2>
        <p id="planet-desc"></p>
        <div id="planet-resource" class="resource-line"></div>
      </div>
    </div>

    <div class="panel" id="mine-panel">
      <div class="mine-wrap">
        <button id="mine-btn">
          <span class="mine-ring"></span>
          <span class="mine-core">⛏<br>MINE</span>
        </button>
        <span id="mine-info"></span>
      </div>
    </div>

    <div class="cols">
      <div class="panel" id="buildings-panel">
        <h3>Colonists
          <span class="buy-mode">
            <button data-buy="1" class="buy active">×1</button>
            <button data-buy="10" class="buy">×10</button>
            <button data-buy="max" class="buy">MAX</button>
          </span>
        </h3>
        <div id="buildings"></div>
      </div>

      <div>
        <div class="panel" id="upgrades-panel">
          <h3>Upgrades</h3>
          <div id="upgrades"></div>
        </div>

        <div class="panel" id="prestige-view">
          <h3>✦ Ascendancy</h3>
          <div id="shard-info"></div>
          <button id="ascend-btn">ASCEND</button>
          <div id="masteries"></div>
        </div>

        <div class="panel" id="research-view">
          <h3>🧪 Research Lab</h3>
          <div id="techs"></div>
          <div id="next-planet" class="next-planet"></div>
        </div>
      </div>
    </div>
  </section>
</main>

<footer><small>AUTOSAVES EVERY 10s · PROGRESS CONTINUES OFFLINE AT 50% RATE</small></footer>

<script src="game.js"></script>
</body>
</html>
